services:
  rssbot:
    build: .
    container_name: rss-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - rssbot-data:/app/data
      - ./logs:/app/logs
    environment:
      CONFIG_PATH: /app/config/config.json
      DATABASE_PATH: /app/data/rssbot.sqlite
      LOG_LEVEL: INFO
      ROUTING_DEBUG_EMBEDS: "false"
      DRAFT_WORKER_URL: "http://host.docker.internal:8765/draft"
      DRAFT_TIMEOUT_SECONDS: "120"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  rssbot-data:
    external: true
    name: rssbot-data
